naftiko: 1.0.0-alpha2
info:
  label: MiniMax API — Text to Audio
  description: 'MiniMax API — Text to Audio. 3 operations. Lead operation: Query T2A Async V2 Task Status. Self-contained
    Naftiko capability covering one Minimax Ai business surface.'
  tags:
  - Minimax Ai
  - Text to Audio
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MINIMAX_AI_API_KEY: MINIMAX_AI_API_KEY
capability:
  consumes:
  - type: http
    namespace: minimax-ai-text-to-audio
    baseUri: https://api.minimax.io
    description: MiniMax API — Text to Audio business capability. Self-contained, no shared references.
    resources:
    - name: v1-query-t2a_async_query_v2
      path: /v1/query/t2a_async_query_v2
      operations:
      - name: t2aasyncv2query
        method: POST
        description: Query T2A Async V2 Task Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-t2a_async_v2
      path: /v1/t2a_async_v2
      operations:
      - name: t2aasyncv2
        method: POST
        description: Text to Audio Async V2
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-t2a_v2
      path: /v1/t2a_v2
      operations:
      - name: t2av2
        method: POST
        description: Text to Audio V2
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MINIMAX_AI_API_KEY}}'
  exposes:
  - type: rest
    namespace: minimax-ai-text-to-audio-rest
    port: 8080
    description: REST adapter for MiniMax API — Text to Audio. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/query/t2a-async-query-v2
      name: v1-query-t2a-async-query-v2
      description: REST surface for v1-query-t2a_async_query_v2.
      operations:
      - method: POST
        name: t2aasyncv2query
        description: Query T2A Async V2 Task Status
        call: minimax-ai-text-to-audio.t2aasyncv2query
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/t2a-async-v2
      name: v1-t2a-async-v2
      description: REST surface for v1-t2a_async_v2.
      operations:
      - method: POST
        name: t2aasyncv2
        description: Text to Audio Async V2
        call: minimax-ai-text-to-audio.t2aasyncv2
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/t2a-v2
      name: v1-t2a-v2
      description: REST surface for v1-t2a_v2.
      operations:
      - method: POST
        name: t2av2
        description: Text to Audio V2
        call: minimax-ai-text-to-audio.t2av2
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: minimax-ai-text-to-audio-mcp
    port: 9090
    transport: http
    description: MCP adapter for MiniMax API — Text to Audio. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: query-t2a-async-v2-task
      description: Query T2A Async V2 Task Status
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: minimax-ai-text-to-audio.t2aasyncv2query
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: text-audio-async-v2
      description: Text to Audio Async V2
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-text-to-audio.t2aasyncv2
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: text-audio-v2
      description: Text to Audio V2
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-text-to-audio.t2av2
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
