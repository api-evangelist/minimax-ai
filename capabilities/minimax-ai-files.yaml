naftiko: 1.0.0-alpha2
info:
  label: MiniMax API — Files
  description: 'MiniMax API — Files. 5 operations. Lead operation: Delete File. Self-contained Naftiko capability covering
    one Minimax Ai business surface.'
  tags:
  - Minimax Ai
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MINIMAX_AI_API_KEY: MINIMAX_AI_API_KEY
capability:
  consumes:
  - type: http
    namespace: minimax-ai-files
    baseUri: https://api.minimax.io
    description: MiniMax API — Files business capability. Self-contained, no shared references.
    resources:
    - name: v1-files-delete
      path: /v1/files/delete
      operations:
      - name: deletefile
        method: POST
        description: Delete File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: GroupId
          in: query
          type: string
          description: Group ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-files-list
      path: /v1/files/list
      operations:
      - name: listfiles
        method: GET
        description: List Files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: GroupId
          in: query
          type: string
          description: Group ID
          required: true
        - name: purpose
          in: query
          type: string
          description: Filter by file purpose
        - name: page
          in: query
          type: integer
          description: Page number for pagination
        - name: size
          in: query
          type: integer
          description: Number of files per page
        - name: after_file_id
          in: query
          type: integer
          description: File ID to start listing after
    - name: v1-files-retrieve
      path: /v1/files/retrieve
      operations:
      - name: retrievefile
        method: GET
        description: Retrieve File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: GroupId
          in: query
          type: string
          description: Group ID
          required: true
        - name: file_id
          in: query
          type: integer
          description: File ID to retrieve
          required: true
    - name: v1-files-retrieve_content
      path: /v1/files/retrieve_content
      operations:
      - name: retrievefilecontent
        method: GET
        description: Retrieve File Content
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: GroupId
          in: query
          type: string
          description: Group ID
          required: true
        - name: file_id
          in: query
          type: integer
          description: File ID to retrieve content
          required: true
    - name: v1-files-upload
      path: /v1/files/upload
      operations:
      - name: uploadfile
        method: POST
        description: Upload File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: GroupId
          in: query
          type: string
          description: Group ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MINIMAX_AI_API_KEY}}'
  exposes:
  - type: rest
    namespace: minimax-ai-files-rest
    port: 8080
    description: REST adapter for MiniMax API — Files. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/v1/files/delete
      name: v1-files-delete
      description: REST surface for v1-files-delete.
      operations:
      - method: POST
        name: deletefile
        description: Delete File
        call: minimax-ai-files.deletefile
        with:
          GroupId: rest.GroupId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/files/list
      name: v1-files-list
      description: REST surface for v1-files-list.
      operations:
      - method: GET
        name: listfiles
        description: List Files
        call: minimax-ai-files.listfiles
        with:
          GroupId: rest.GroupId
          purpose: rest.purpose
          page: rest.page
          size: rest.size
          after_file_id: rest.after_file_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/files/retrieve
      name: v1-files-retrieve
      description: REST surface for v1-files-retrieve.
      operations:
      - method: GET
        name: retrievefile
        description: Retrieve File
        call: minimax-ai-files.retrievefile
        with:
          GroupId: rest.GroupId
          file_id: rest.file_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/files/retrieve-content
      name: v1-files-retrieve-content
      description: REST surface for v1-files-retrieve_content.
      operations:
      - method: GET
        name: retrievefilecontent
        description: Retrieve File Content
        call: minimax-ai-files.retrievefilecontent
        with:
          GroupId: rest.GroupId
          file_id: rest.file_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/files/upload
      name: v1-files-upload
      description: REST surface for v1-files-upload.
      operations:
      - method: POST
        name: uploadfile
        description: Upload File
        call: minimax-ai-files.uploadfile
        with:
          GroupId: rest.GroupId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: minimax-ai-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for MiniMax API — Files. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: delete-file
      description: Delete File
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-files.deletefile
      with:
        GroupId: tools.GroupId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-files
      description: List Files
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: minimax-ai-files.listfiles
      with:
        GroupId: tools.GroupId
        purpose: tools.purpose
        page: tools.page
        size: tools.size
        after_file_id: tools.after_file_id
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-file
      description: Retrieve File
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: minimax-ai-files.retrievefile
      with:
        GroupId: tools.GroupId
        file_id: tools.file_id
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-file-content
      description: Retrieve File Content
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: minimax-ai-files.retrievefilecontent
      with:
        GroupId: tools.GroupId
        file_id: tools.file_id
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-file
      description: Upload File
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-files.uploadfile
      with:
        GroupId: tools.GroupId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
