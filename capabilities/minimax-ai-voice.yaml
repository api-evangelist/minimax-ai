naftiko: 1.0.0-alpha2
info:
  label: MiniMax API — Voice
  description: 'MiniMax API — Voice. 4 operations. Lead operation: Delete Voice. Self-contained Naftiko capability covering
    one Minimax Ai business surface.'
  tags:
  - Minimax Ai
  - Voice
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MINIMAX_AI_API_KEY: MINIMAX_AI_API_KEY
capability:
  consumes:
  - type: http
    namespace: minimax-ai-voice
    baseUri: https://api.minimax.io
    description: MiniMax API — Voice business capability. Self-contained, no shared references.
    resources:
    - name: v1-delete_voice
      path: /v1/delete_voice
      operations:
      - name: deletevoice
        method: POST
        description: Delete Voice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-get_voice
      path: /v1/get_voice
      operations:
      - name: getvoice
        method: POST
        description: Get Voice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-voice_clone
      path: /v1/voice_clone
      operations:
      - name: voiceclone
        method: POST
        description: Voice Clone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-voice_design
      path: /v1/voice_design
      operations:
      - name: voicedesign
        method: POST
        description: Voice Design
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MINIMAX_AI_API_KEY}}'
  exposes:
  - type: rest
    namespace: minimax-ai-voice-rest
    port: 8080
    description: REST adapter for MiniMax API — Voice. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/v1/delete-voice
      name: v1-delete-voice
      description: REST surface for v1-delete_voice.
      operations:
      - method: POST
        name: deletevoice
        description: Delete Voice
        call: minimax-ai-voice.deletevoice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/get-voice
      name: v1-get-voice
      description: REST surface for v1-get_voice.
      operations:
      - method: POST
        name: getvoice
        description: Get Voice
        call: minimax-ai-voice.getvoice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/voice-clone
      name: v1-voice-clone
      description: REST surface for v1-voice_clone.
      operations:
      - method: POST
        name: voiceclone
        description: Voice Clone
        call: minimax-ai-voice.voiceclone
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/voice-design
      name: v1-voice-design
      description: REST surface for v1-voice_design.
      operations:
      - method: POST
        name: voicedesign
        description: Voice Design
        call: minimax-ai-voice.voicedesign
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: minimax-ai-voice-mcp
    port: 9090
    transport: http
    description: MCP adapter for MiniMax API — Voice. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: delete-voice
      description: Delete Voice
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-voice.deletevoice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-voice
      description: Get Voice
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: minimax-ai-voice.getvoice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: voice-clone
      description: Voice Clone
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-voice.voiceclone
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: voice-design
      description: Voice Design
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-voice.voicedesign
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
