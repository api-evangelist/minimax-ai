naftiko: 1.0.0-alpha2
info:
  label: MiniMax API — Music
  description: 'MiniMax API — Music. 1 operations. Lead operation: Music Generation. Self-contained Naftiko capability covering
    one Minimax Ai business surface.'
  tags:
  - Minimax Ai
  - Music
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MINIMAX_AI_API_KEY: MINIMAX_AI_API_KEY
capability:
  consumes:
  - type: http
    namespace: minimax-ai-music
    baseUri: https://api.minimax.io
    description: MiniMax API — Music business capability. Self-contained, no shared references.
    resources:
    - name: v1-music_generation
      path: /v1/music_generation
      operations:
      - name: generatemusic
        method: POST
        description: Music Generation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MINIMAX_AI_API_KEY}}'
  exposes:
  - type: rest
    namespace: minimax-ai-music-rest
    port: 8080
    description: REST adapter for MiniMax API — Music. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/v1/music-generation
      name: v1-music-generation
      description: REST surface for v1-music_generation.
      operations:
      - method: POST
        name: generatemusic
        description: Music Generation
        call: minimax-ai-music.generatemusic
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: minimax-ai-music-mcp
    port: 9090
    transport: http
    description: MCP adapter for MiniMax API — Music. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: music-generation
      description: Music Generation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: minimax-ai-music.generatemusic
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
